<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self' https://pocket-collection.shigeruhagano.workers.dev; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin"><script src="theme.js"></script>
<title>Pocket-Sammlung</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='4' y='2' width='16' height='20' rx='3' fill='%233b6fd8'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="pocket.css">
</head>
<body>
<header><div class="bar">
<div class="brand"><h1 data-t="title">Pocket-Sammlung</h1><div data-t="subtitle">Pokémon TCG Pocket · Sammlung, Fortschritt und Tausch in der Gruppe</div></div>
<div class="pk-lang segmented" role="group" aria-label="Sprache / Language"><button type="button" data-lang="de">DE</button><button type="button" data-lang="en">EN</button></div>
<button type="button" id="pkTheme" class="pill" aria-label="Hell / Dunkel" title="Hell / Dunkel / Automatisch"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
</div></header>
<main class="pk-page">
<section class="pk-me">
<label><span data-t="person">Du bist</span> <select id="pkPerson" class="pill" disabled></select></label>
<label><span data-t="account">Konto</span> <select id="pkAccount" class="pill"></select></label>
<button type="button" id="pkAccounts" class="pill" data-t="manageAccounts" hidden>Konten verwalten</button>
<span id="pkSave" class="pk-save" role="status"></span>
</section>
<div id="pkLogin" class="pk-login" role="status"></div>
<p id="pkStatus" class="pk-hint" role="status"></p>
<nav class="pk-tabs segmented" aria-label="Bereiche">
<button type="button" data-tab="cards" data-t="tabCards">Sammlung</button>
<button type="button" data-tab="progress" data-t="tabProgress">Fortschritt</button>
<button type="button" data-tab="trade" data-t="tabTrade">Tausch</button>
<button type="button" data-tab="worth" data-t="tabWorth">Tauschwert</button>
</nav>

<section id="pkCards" data-panel="cards">
<div class="pk-filters">
<select id="pkSet" class="pill" aria-label="Set"></select>
<select id="pkRarity" class="pill" aria-label="Rarity"></select>
<select id="pkShow" class="pill" aria-label="Filter"></select>
<input id="pkSearch" class="pill" type="search" autocomplete="off">
</div>
<p id="pkCardsHint" class="pk-hint"></p>
<div id="pkGrid" class="pk-grid"></div>
<button type="button" id="pkMore" class="pill pk-more" hidden></button>
</section>

<section id="pkProgress" data-panel="progress" hidden>
<h2 data-t="packsTitle">Welches Pack öffnen?</h2>
<p class="pk-hint" data-t="packsHint"></p>
<div id="pkPacks" class="pk-table-wrap"></div>
<h2 data-t="setsTitle">Sets</h2>
<div id="pkSets" class="pk-sets"></div>
</section>

<section id="pkTrade" data-panel="trade" hidden>
<p class="pk-hint" data-t="tradeHint"></p>
<label class="pk-check"><input type="checkbox" id="pkOnlyWanted"> <span data-t="onlyWanted">Nur Wunschliste und Chase</span></label>
<div id="pkOwn"></div>
<div id="pkMatches"></div>
</section>

<section id="pkWorth" data-panel="worth" hidden>
<p class="pk-hint" data-t="worthHint"></p>
<div class="pk-filters"><select id="pkWorthRarity" class="pill" aria-label="Rarity"></select></div>
<div id="pkWorthList"></div>
</section>

<dialog id="pkCardDlg" class="dlg pk-dlg" aria-labelledby="pkCardTitle">
<form method="dialog">
<div class="pk-dlg-head"><img id="pkCardImg" alt="" width="150" height="209"><div><h2 id="pkCardTitle"></h2><p id="pkCardMeta" class="pk-hint"></p><div id="pkCardMarks" class="pk-marks"></div></div></div>
<div id="pkCardAccounts" class="pk-steppers"></div>
<div id="pkCardGroup"></div>
<div class="dlg-row dlg-foot"><button value="cancel" class="pill primary">OK</button></div>
</form>
</dialog>

<dialog id="pkAccountsDlg" class="dlg pk-dlg" aria-labelledby="pkAccountsTitle">
<form method="dialog">
<h2 id="pkAccountsTitle" data-t="manageAccounts">Konten verwalten</h2>
<p class="pk-hint" data-t="accountsHint"></p>
<div id="pkAccountList" class="pk-account-list"></div>
<button type="button" id="pkAddAccount" class="pill" data-t="addAccount">+ Konto</button>
<div class="dlg-row dlg-foot"><button value="cancel" class="pill primary">OK</button></div>
</form>
</dialog>
</main>
<script type="module" src="app.mjs"></script>
</body>
</html>
