<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same rules as the schedule: only this site's own code, talking to AniList and the Google Sheet. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';
  img-src 'self' https://*.anilist.co; connect-src 'self' https://graphql.anilist.co https://docs.google.com
  https://*.googleusercontent.com https://sheets.googleapis.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Watch planner</title>
<link rel="icon" type="image/png" href="icon-72.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- A page of its own, opened in a new tab from the link below the schedule. It only reads the Guckplan
     and suggests a plan; it never changes the sheet or the schedule. -->
<header>
  <div class="bar">
    <img class="logo" src="icon-72.png" alt="" width="36" height="36"><div class="brand">
      <h1>Watch planner</h1>
      <div id="tabName">Suggestions only · nothing in the Guckplan changes</div>
    </div>
  </div>
</header>
<main>
  <div id="list"><div class="status">Loading…</div></div>
</main>
<div id="notice" role="status" hidden><span id="noticeText"></span></div>
<script src="common.js"></script>
<script src="xlsx.js"></script>
<script src="planner.js"></script>
</body>
</html>
