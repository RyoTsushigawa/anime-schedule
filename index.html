<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulcast Schedule</title>
<style>
  :root {
    --bg: #f6f6f8; --card: #ffffff; --text: #1b1b1f; --muted: #6b6b75; --line: #e3e3e8;
    --accent: #f47521; --accent-text: #ffffff; --today: #fff4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121216; --card: #1c1c22; --text: #ececf1; --muted: #9a9aa5; --line: #2c2c34;
      --accent: #f47521; --accent-text: #ffffff; --today: #2a1f18;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  h1 { font-size: 18px; margin: 0 auto 0 0; }
  button, input, select { font: inherit; color: inherit; }
  button, select { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 4px 10px; border-radius: 99px; color: var(--muted); font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  label { display: flex; gap: 6px; align-items: center; color: var(--muted); user-select: none; }
  #week { color: var(--muted); min-width: 140px; text-align: center; }
  main { padding: 16px; max-width: 1000px; margin: 0 auto; }
  .day { margin-bottom: 22px; }
  .day h2 { font-size: 15px; margin: 0 0 8px; padding: 6px 10px; border-radius: 8px; }
  .day.is-today h2 { background: var(--today); color: var(--accent); }
  .row { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 6px; }
  .row.aired { opacity: .6; }
  .row img { width: 44px; height: 62px; object-fit: cover; border-radius: 6px; flex: none; background: var(--line); }
  .time { width: var(--time-width, auto); flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
  .info { flex: 1; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .title a { color: inherit; text-decoration: none; }
  .title a:hover { text-decoration: underline; }
  .ep { color: var(--muted); font-size: 13px; }
  .cr { flex: none; background: var(--accent); color: var(--accent-text); text-decoration: none; font-weight: 600; font-size: 13px; padding: 7px 12px; border-radius: 8px; white-space: nowrap; }
  .links { flex: none; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 45%; }
  .cr.other { background: transparent; border: 1px solid; font-weight: 500; }
  .cr.none { background: #1e1e22; color: #ffffff; box-shadow: inset 0 0 0 1px #3a3a42; }
  .status { color: var(--muted); text-align: center; padding: 40px 0; }
  details { color: var(--muted); font-size: 13px; margin-top: 28px; }
  details ul { margin: 6px 0 0; padding-left: 20px; }
  @media (max-width: 560px) {
    .row img { display: none; }
    .cr { padding: 7px 9px; }
  }
</style>
</head>
<body>
<header>
  <h1>Simulcast Schedule</h1>
  <button id="prev" aria-label="Previous week">&larr;</button>
  <span id="week"></span>
  <button id="next" aria-label="Next week">&rarr;</button>
  <button id="thisWeek">This week</button>
  <label id="tabName">Guckplan</label>
  <div id="people" class="chips" role="group" aria-label="People"></div>
  <label><input type="checkbox" id="todayFirst"> Today first</label>
  <label><input type="checkbox" id="others"> Other services</label>
</header>
<main id="list"><div class="status">Loading…</div></main>

<script>
const API = 'https://graphql.anilist.co';
// The group's Google Sheet. The page only reads it (tab list + CSV export), never writes to it.
const SHEET = 'https://docs.google.com/spreadsheets/d/1cbkuLjyLfHpYDor5A1LvIskEOUB9Ij2Nm2TYch62-hQ';
const FALLBACK_TAB = { name: 'Guckplan Herbst 2026', gid: '488548700' };
// First month of each season, as the tabs are named ("Guckplan Winter 2027").
const SEASON_MONTH = { winter: 0, frühling: 3, fruehling: 3, frühjahr: 3, sommer: 6, herbst: 9 };
const DEFAULT_PERSON = 'MaRyo';

const QUERY = `query ($page: Int, $from: Int, $to: Int) {
  Page(page: $page, perPage: 50) {
    pageInfo { hasNextPage }
    airingSchedules(airingAt_greater: $from, airingAt_lesser: $to, sort: TIME) {
      airingAt episode
      media {
        id isAdult siteUrl
        title { romaji english }
        synonyms
        coverImage { medium }
        externalLinks { site url }
      }
    }
  }
}`;

const $ = id => document.getElementById(id);
const cache = new Map();
let weekOffset = 0;
// People whose shows are shown (toggles in the header), remembered per browser.
const selectedPeople = new Set([DEFAULT_PERSON]);
try {
  const saved = JSON.parse(localStorage.getItem('people'));
  if (Array.isArray(saved)) { selectedPeople.clear(); saved.forEach(p => selectedPeople.add(p)); }
} catch {}
let streamsDe = null; // streams-de.json: { generated, byAnilist: { anilistId: [{ name, url }] } }
let tabs = []; // Guckplan tabs, newest first
// Each tab's sheet: { people: [...], shows: [{ romaji, english, wo, tag, time, votes: { name: value } }] }

// AniList / LiveChart site name pattern → button label and colour. `wo` is the sheet's "Wo" code
// ("P" in the sheet means no legal stream, so it has no service here). `main` = a service the group
// has; everything else only shows with the "Other services" toggle.
const SERVICES = [
  { match: /crunchyroll/i, label: 'Crunchyroll', color: '#f47521', wo: 'C', main: true, search: 'https://www.crunchyroll.com/search?q=' },
  { match: /netflix/i, label: 'Netflix', color: '#e50914', wo: 'N', main: true, search: 'https://www.netflix.com/search?q=' },
  { match: /amazon|prime video/i, label: 'Prime Video', color: '#1a98ff', wo: 'AM', main: true, search: 'https://www.primevideo.com/search/?phrase=' },
  { match: /youtube/i, label: 'YouTube', color: '#ff0033', wo: 'Y', main: true },
  { match: /disney/i, label: 'Disney+', color: '#113ccf', wo: 'D+', search: 'https://www.disneyplus.com/search?q=' },
  { match: /hidive/i, label: 'HIDIVE', color: '#00aeef', wo: 'H' },
  { match: /^adn$|animation digital network/i, label: 'ADN', color: '#0096d6', wo: 'ADN' },
];

// ---------- Sheet ----------

function parseCsv(text) {
  const rows = [[]];
  let field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { rows.at(-1).push(field); field = ''; }
    else if (c === '\n') { rows.at(-1).push(field.replace(/\r$/, '')); field = ''; rows.push([]); }
    else field += c;
  }
  rows.at(-1).push(field);
  return rows;
}

// Returns the copy saved in this browser right away (if there is one) and downloads a fresh one in
// the background; onChange runs when the fresh copy differs. Without a saved copy it waits for the download.
function savedOrFresh(key, download, onChange) {
  let saved = null;
  try { saved = localStorage.getItem(key); } catch {}
  const fresh = download().then(value => {
    const json = JSON.stringify(value);
    try { localStorage.setItem(key, json); } catch {}
    if (saved && json !== saved) onChange(value);
    return value;
  });
  if (!saved) return fresh;
  fresh.catch(e => console.warn(`${key}: kept the saved copy,`, e));
  return Promise.resolve(JSON.parse(saved));
}

// All "Guckplan <Season> <Year>" tabs with their start dates (as timestamps), newest first.
async function guckplanTabs() {
  const html = await (await fetch(SHEET + '/htmlview')).text();
  const tabs = [];
  for (const [, name, gid] of html.matchAll(/\{name: "([^"]+)", pageUrl: "[^"]*gid=(\d+)/g)) {
    const m = name.match(/^Guckplan\s+(\S+)\s+(\d{4})/i);
    const month = m && SEASON_MONTH[m[1].toLowerCase()];
    if (month !== undefined && month !== null) tabs.push({ name, gid, start: new Date(Number(m[2]), month, 1).getTime() });
  }
  return tabs.sort((a, b) => b.start - a.start);
}

// The tab whose season the date falls in (newest season that has started), else the oldest one.
function tabFor(tabs, date) {
  return tabs.find(t => t.start <= date) || tabs.at(-1) || FALLBACK_TAB;
}

// Tabs that can be active around a date: its own season's tab plus the ones next to it, so shows
// that run on from the last plan or premiere early for the next one aren't lost in the overlap.
function activeTabs(tabs, date) {
  const tab = tabFor(tabs, date);
  const i = tabs.indexOf(tab);
  return i < 0 ? [tab] : [tab, tabs[i - 1], tabs[i + 1]].filter(Boolean);
}

const sheets = new Map();
// A tab's Guckplan: the last copy shown in this browser at once, then the current one when it arrives.
const sheetFor = tab => {
  if (!sheets.has(tab.gid)) {
    const onChange = fresh => { sheets.set(tab.gid, Promise.resolve(fresh)); load(true); };
    sheets.set(tab.gid, savedOrFresh('sheet:' + tab.gid, () => loadSheet(tab.gid), onChange)
      .catch(e => { sheets.delete(tab.gid); throw e; }));
  }
  return sheets.get(tab.gid);
};

async function loadSheet(gid) {
  const res = await fetch(`${SHEET}/export?format=csv&gid=${gid}`);
  if (!res.ok) throw new Error('Google Sheet returned ' + res.status);
  const rows = parseCsv(await res.text());
  const headerIndex = rows.findIndex(r => r.some(c => c.trim() === 'Anime Titel'));
  const header = rows[headerIndex].map(c => c.trim());
  const col = name => header.indexOf(name);
  const people = header.slice(col('Uhrzeit') + 1).filter(Boolean);
  const shows = [];
  for (const r of rows.slice(headerIndex + 1)) {
    const romaji = (r[col('Anime Titel')] || '').trim();
    if (!romaji) break; // the summary block below the list starts after an empty title
    const votes = {};
    for (const p of people) votes[p] = (r[header.indexOf(p)] || '').trim().replace(/,$/, '');
    shows.push({
      romaji, english: (r[col('Eng Anime Titel')] || '').trim(),
      wo: (r[col('Wo')] || '').trim().toUpperCase(),
      tag: (r[col('Tag')] || '').trim(), time: (r[col('Uhrzeit')] || '').trim(), votes,
    });
  }
  return { people, shows };
}

// The sheet shows one person watches: Ja / Vielleicht / Wenn Belly dabei ist,
// plus any show named in that person's column.
function picks(sheet, person) {
  const result = new Set();
  for (const show of sheet.shows) {
    const v = show.votes[person] || '';
    if (/^(ja|vielleicht)$|^wenn belly/i.test(v)) result.add(show);
    else if (v && !/^(nein|default|allein)$/i.test(v)) {
      const named = sheet.shows.find(s => titleMatches([s.romaji, s.english], [v]));
      if (named) result.add(named);
    }
  }
  return result;
}

// ---------- Title matching ----------

const norm = s => String(s || '').normalize('NFKD').toLowerCase()
  .replace(/½/g, '12').replace(/\b(\d+)(st|nd|rd|th) season\b/g, 'season $1').replace(/[^a-z0-9]/g, '');

// 2 = same title, 1 = one title starts with the other (e.g. "Season 2" spelled differently), 0 = no match.
function titleScore(a, b) {
  const A = a.map(norm).filter(Boolean), B = b.map(norm).filter(Boolean);
  if (A.some(x => B.includes(x))) return 2;
  return A.some(x => B.some(y => Math.min(x.length, y.length) >= 8 && (x.startsWith(y) || y.startsWith(x)))) ? 1 : 0;
}
const titleMatches = (a, b) => titleScore(a, b) > 0;

const mediaTitles = m => [m.title.romaji, m.title.english, ...(m.synonyms || [])];

// ---------- AniList ----------

function weekStart(offset) {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + offset * 7); // Monday
  return d;
}

// One week of airings. Kept in memory, and in the browser: used as is for 30 minutes so reloads are
// instant, and as a fallback for 7 days when AniList is unreachable or limiting requests.
const WEEK_CACHE_MS = 30 * 60 * 1000;
const WEEK_KEEP_MS = 7 * 86400 * 1000;
function fetchWeek(start) {
  const key = start.getTime();
  if (!cache.has(key)) cache.set(key, downloadWeek(start).catch(e => { cache.delete(key); throw e; }));
  return cache.get(key);
}

async function downloadWeek(start) {
  const storeKey = 'week:' + start.getTime();
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(storeKey)); } catch {}
  if (saved && Date.now() - saved.time < WEEK_CACHE_MS) return saved.items;
  if (saved) {
    // Older copy: show it now and update in the background (re-rendering if anything changed).
    downloadAirings(start).then(items => {
      storeWeek(storeKey, items);
      if (JSON.stringify(items) !== JSON.stringify(saved.items)) {
        cache.set(start.getTime(), Promise.resolve(items));
        load(true);
      }
    }, () => {});
    return saved.items;
  }
  let items;
  try {
    items = await downloadAirings(start);
  } catch (e) {
    throw new Error("AniList isn't answering right now (it limits how often it can be asked). Try again in a minute.");
  }
  storeWeek(storeKey, items);
  return items;
}

function storeWeek(storeKey, items) {
  try {
    // Drop weeks too old to be a useful fallback, so the browser storage doesn't fill up.
    for (const k of Object.keys(localStorage)) if (k.startsWith('week:') && k !== storeKey) {
      const t = JSON.parse(localStorage.getItem(k))?.time;
      if (!t || Date.now() - t > WEEK_KEEP_MS) localStorage.removeItem(k);
    }
    localStorage.setItem(storeKey, JSON.stringify({ time: Date.now(), items }));
  } catch {}
}

// All airings of one week from AniList. When AniList limits requests it answers 429 without the
// header browsers need, so that shows up as a network error: both get a few retries with waits.
async function downloadAirings(start) {
  const from = Math.floor(start / 1000) - 1;
  const to = from + 7 * 86400 + 1;
  const items = [];
  const waits = [4000, 12000, 30000];
  for (let page = 1, attempt = 0; ;) {
    let res;
    try {
      res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ query: QUERY, variables: { page, from, to } }),
      });
    } catch (e) {
      res = null;
    }
    if (!res || res.status === 429 || res.status >= 500) {
      if (attempt >= waits.length) throw new Error('AniList unreachable');
      const status = document.querySelector('#list .status');
      if (status) status.textContent = 'AniList is busy, trying again…';
      await new Promise(r => setTimeout(r, waits[attempt++]));
      continue;
    }
    if (!res.ok) throw new Error('AniList returned ' + res.status);
    const { data } = await res.json();
    items.push(...data.Page.airingSchedules);
    if (!data.Page.pageInfo.hasNextPage) return items;
    page++;
  }
}

// Buttons for every service the show is on, with the one from the sheet's "Wo" column first.
function streamLinks(media, wo, searchTitle) {
  const links = [];
  // German availability from LiveChart (tools/build-streams.mjs) wins over AniList's worldwide links.
  const de = streamsDe?.byAnilist[media.id];
  if (de?.length) {
    for (const { name, url } of de) {
      const s = SERVICES.find(s => s.match.test(name));
      if (!links.some(l => l.url === url))
        links.push({ url, label: s?.label || name, color: s?.color || '#5b5b66', main: !!s?.main, first: !!s && s.wo === wo });
    }
    return links.sort((a, b) => b.first - a.first);
  }
  for (const s of SERVICES) {
    // AniList's YouTube links are mostly trailer channels; only trust them when the sheet says Y.
    if (s.wo === 'Y' && wo !== 'Y') continue;
    const series = (media.externalLinks || []).find(l => s.match.test(l.site));
    if (series) links.push({ url: series.url, label: s.label, color: s.color, main: !!s.main, first: s.wo === wo });
  }
  // The sheet says where it streams but AniList has no link: fall back to that service's search.
  const service = SERVICES.find(s => s.wo === wo);
  if (service?.search && !links.some(l => l.first))
    links.unshift({ url: service.search + encodeURIComponent(searchTitle), label: service.label + ' 🔍', color: service.color, main: !!service.main, first: true });
  return links.sort((a, b) => b.first - a.first);
}

// ---------- Render ----------

const WEEKDAYS = ['mo', 'di', 'mi', 'do', 'fr', 'sa', 'so'];

// The day an episode shows up on: the sheet's "Tag" (watch day) on or after the airing day,
// or the airing day itself when the sheet has no day for it.
function watchDay(aired, tag) {
  const day = new Date(aired);
  day.setHours(0, 0, 0, 0);
  const target = WEEKDAYS.indexOf(String(tag || '').toLowerCase().replace(/\W/g, '').slice(0, 2));
  if (target < 0) return day;
  day.setDate(day.getDate() + (target - (day.getDay() + 6) % 7 + 7) % 7);
  return day;
}

// Our services as buttons; anything else only with the "Other services" toggle, outlined.
// Without any of our services the show is marked as piracy.
function linkButtons(links) {
  const button = l => l.main
    ? `<a class="cr" style="background:${l.color}" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`
    : `<a class="cr other" style="color:${l.color};border-color:${l.color}" href="${esc(l.url)}" target="_blank" rel="noopener" title="Available, but not a service we have">${esc(l.label)}</a>`;
  const shown = links.filter(l => l.main || $('others').checked);
  // The piracy label is a rickroll, nothing more.
  return (links.some(l => l.main) ? '' : '<a class="cr none" href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener" title="Not on any of our services">Piracy</a>')
    + shown.map(button).join('');
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// plans: Map tab gid → sheet, for every Guckplan tab that can be active this week.
function render(items, start, plans) {
  // Shows any selected person watches; nobody selected = nothing.
  const people = [...selectedPeople];
  if (!people.length) {
    $('list').innerHTML = '<div class="status">Pick at least one person above.</div>';
    return;
  }
  const chosen = people.length
    ? new Map([...plans.values()].map(s => [s, new Set(people.flatMap(p => [...picks(s, p)]))]))
    : null;
  const found = new Set();
  const now = Date.now() / 1000;
  const today = new Date().toDateString();
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    days.push({ date: d, rows: [] });
  }
  // A sheet show only links to its best-matching AniList entries, so spin-off mini anime
  // ("… Mini Anime" synonyms) don't tag along with the main show.
  const score = (s, m) => titleScore([s.romaji, s.english], mediaTitles(m));
  const best = new Map();
  for (const sheet of plans.values())
    for (const s of sheet.shows) best.set(s, Math.max(0, ...items.map(it => score(s, it.media))));
  for (const it of items) {
    const m = it.media;
    if (m.isAdult) continue;
    const when = new Date(it.airingAt * 1000);
    // Look the show up in the tab for the airing date first; the neighbouring tabs only
    // count for shows that tab doesn't list.
    let show, sheet;
    for (const tab of activeTabs(tabs, when)) {
      sheet = plans.get(tab.gid);
      show = sheet?.shows.find(s => best.get(s) > 0 && score(s, m) === best.get(s));
      if (show) break;
    }
    if (chosen && !(show && chosen.get(sheet).has(show))) continue;
    const links = streamLinks(m, show?.wo, m.title.english || m.title.romaji);
    if (!chosen && !links.some(l => l.main || $('others').checked)) continue;
    const day = days.find(d => d.date.toDateString() === watchDay(when, show?.tag).toDateString());
    if (!day) continue;
    if (show) found.add(show);
    // One entry per show and week; several episodes (batch drops, double episodes) are merged.
    const existing = days.flatMap(d => d.rows).find(r => r.m.id === m.id);
    if (existing) existing.episodes.push(it.episode);
    else day.rows.push({ it, m, links, when, show, episodes: [it.episode] });
  }
  for (const d of days) d.rows.sort((a, b) => a.it.airingAt - b.it.airingAt);

  // "Today first": today on top, then the rest of the week, the days already past at the end.
  const todayIndex = days.findIndex(d => d.date.toDateString() === today);
  const ordered = $('todayFirst').checked && todayIndex > 0
    ? [...days.slice(todayIndex), ...days.slice(0, todayIndex)]
    : days;
  let html = ordered.map(({ date, rows }) => {
    const heading = date.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
    const body = rows.length ? rows.map(({ it, m, links, when, episodes }) => `
      <div class="row${it.airingAt < now ? ' aired' : ''}">
        <div class="time">${when.toLocaleDateString(undefined, { weekday: 'short' })} ${when.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })}</div>
        <img src="${esc(m.coverImage.medium)}" alt="" loading="lazy">
        <div class="info">
          <div class="title"><a href="${esc(m.siteUrl)}" target="_blank" rel="noopener">${esc(m.title.english || m.title.romaji)}</a></div>
          <div class="ep">${episodes.length > 1 ? `Episodes ${Math.min(...episodes)}–${Math.max(...episodes)}` : `Episode ${it.episode}`}</div>
        </div>
        <div class="links">${linkButtons(links)}</div>
      </div>`).join('') : '<div class="ep" style="padding:0 10px">Nothing airing</div>';
    return `<section class="day${date.toDateString() === today ? ' is-today' : ''}"><h2>${heading}</h2>${body}</section>`;
  }).join('');

  if (chosen) {
    // Only the tab(s) this week's dates belong to, not the neighbours.
    const weekTabs = new Set(days.map(d => tabFor(tabs, d.date).gid));
    const missing = [...weekTabs].flatMap(gid => plans.has(gid) ? [...chosen.get(plans.get(gid))] : []).filter(s => !found.has(s));
    if (missing.length) html += `<details><summary>${missing.length} shows from the Guckplan aren't airing this week (or couldn't be matched)</summary>
      <ul>${missing.map(s => `<li>${esc(s.english || s.romaji)}</li>`).join('')}</ul></details>`;
  }
  document.body.style.removeProperty('--time-width');
  $('list').innerHTML = html;
  // Same width for every time cell (the widest one), so covers and titles line up.
  const times = [...document.querySelectorAll('.time')];
  document.body.style.setProperty('--time-width', Math.max(0, ...times.map(t => t.scrollWidth)) + 'px');
}

// refresh: re-render after newer sheet data arrived, without jumping to today.
async function load(refresh = false) {
  const start = weekStart(weekOffset);
  const end = new Date(start); end.setDate(end.getDate() + 6);
  const fmt = d => d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  $('week').textContent = `${fmt(start)} – ${fmt(end)}`;
  if (!cache.has(start.getTime())) $('list').innerHTML = '<div class="status">Loading…</div>';
  // Last week too: an episode airing after its watch day is watched the following week.
  const lastWeek = new Date(start); lastWeek.setDate(lastWeek.getDate() - 7);
  // Start AniList right away; it runs while the sheet loads.
  const airings = Promise.all([fetchWeek(lastWeek), fetchWeek(start)]);
  airings.catch(() => {}); // handled below
  await ready;

  // Every tab that can be active from last week to the end of this one, loaded side by side.
  const needed = new Map();
  for (const date of [lastWeek, start, end]) for (const t of activeTabs(tabs, date)) needed.set(t.gid, t);
  const plans = new Map();
  await Promise.all([...needed.values()].map(t => sheetFor(t)
    .then(sheet => plans.set(t.gid, sheet))
    .catch(e => console.warn(`${t.name} not loaded:`, e))));
  const weekTabs = [...new Set([tabFor(tabs, start), tabFor(tabs, end)])];
  $('tabName').textContent = weekTabs.map(t => t.name).join(' / ');
  fillPeople([...new Set(weekTabs.flatMap(t => plans.get(t.gid)?.people || []))]);

  try {
    const items = (await airings).flat();
    if (start.getTime() === weekStart(weekOffset).getTime()) render(items, start, plans);
    if (weekOffset === 0 && !refresh) {
      if ($('todayFirst').checked) window.scrollTo(0, 0);
      else document.querySelector('.is-today')?.scrollIntoView({ block: 'start' });
    }
  } catch (e) {
    $('list').innerHTML = `<div class="status">Couldn't load the schedule: ${esc(e.message)}</div>`;
  }
}

$('prev').onclick = () => { weekOffset--; load(); };
$('next').onclick = () => { weekOffset++; load(); };
$('thisWeek').onclick = () => { weekOffset = 0; load(); };
try { $('todayFirst').checked = localStorage.getItem('todayFirst') === '1'; } catch {}
$('todayFirst').onchange = () => {
  try { localStorage.setItem('todayFirst', $('todayFirst').checked ? '1' : '0'); } catch {}
  load();
};
try { $('others').checked = localStorage.getItem('others') === '1'; } catch {}
$('others').onchange = () => {
  try { localStorage.setItem('others', $('others').checked ? '1' : '0'); } catch {}
  load();
};

// The German links and the sheet's tab list, fetched side by side; load() waits for both.
const ready = Promise.all([
  fetch('streams-de.json', { cache: 'no-cache' }).then(r => r.json())
    .then(json => { streamsDe = json; }, e => console.warn('streams-de.json not loaded:', e)),
  savedOrFresh('tabs', guckplanTabs, list => { tabs = list; load(true); })
    .then(list => { tabs = list; }, e => console.warn('Sheet tabs not loaded:', e)),
]);
load();

// People toggles: one button per person in the week's tab(s), rebuilt when the names change.
function fillPeople(people) {
  const box = $('people');
  if ([...box.children].map(b => b.dataset.name).join() === people.join()) return;
  box.replaceChildren(...people.map(name => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.name = name;
    b.textContent = name;
    b.setAttribute('aria-pressed', selectedPeople.has(name));
    b.onclick = () => {
      selectedPeople.has(name) ? selectedPeople.delete(name) : selectedPeople.add(name);
      b.setAttribute('aria-pressed', selectedPeople.has(name));
      try { localStorage.setItem('people', JSON.stringify([...selectedPeople])); } catch {}
      load(true);
    };
    return b;
  }));
}
</script>
