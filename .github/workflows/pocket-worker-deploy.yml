# Deploys the Pocket-Sammlung backend (pocket/worker), its own Cloudflare Worker with its own KV storage.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; POCKET_GROUP_CODE and
# POCKET_ADMIN_KEY are optional. Started by hand.
name: Deploy Pocket worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GROUP_CODE: ${{ secrets.POCKET_GROUP_CODE }}
      ADMIN_KEY: ${{ secrets.POCKET_ADMIN_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned
        with:
          node-version: '22'
      - name: Check required secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || { echo "::error::Missing required secret: $name"; exit 1; }
          done
      - name: Storage (Cloudflare KV "pocket-collection"), created on the first run
        run: |
          find_id() { npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const list=JSON.parse(s.slice(s.indexOf("[")));const n=list.find(x=>x.title==="pocket-collection"||x.title.endsWith("-pocket-collection"));process.stdout.write(n?n.id:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx --yes wrangler@4 kv namespace create pocket-collection; id=$(find_id); fi
          if [ -z "$id" ]; then echo "::error::KV namespace pocket-collection not found or created"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "POCKET"\nid = "%s"\n' "$id" >> pocket/worker/wrangler.toml
      - name: Deploy
        run: npx --yes wrangler@4 deploy --config pocket/worker/wrangler.toml
      - name: Secrets
        run: |
          for name in GROUP_CODE ADMIN_KEY; do
            [ -n "${!name}" ] || continue
            printf '%s' "${!name}" | npx --yes wrangler@4 secret put "$name" --config pocket/worker/wrangler.toml
          done
      - name: Next step
        run: echo "Put the Worker's URL into pocket/config.json as \"api\" if it differs."
