# Every day: the Pokémon TCG Pocket card list for the Pocket-Sammlung (pocket/), so a new set appears by itself.
# Cards, packs, rarities and pull rates from flibustier/pokemon-tcg-pocket-database; German names from TCGdex;
# the art of new cards from flibustier/pokemon-tcg-exchange.
name: Pocket cards

on:
  schedule:
    - cron: '47 4 * * *'   # 04:47 UTC, before the morning in Germany
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pocket-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a moved tag can't change what runs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned
        with:
          node-version: 22
      # German card names: only TCGdex's Pocket folder, no history. Optional: without it the names fall back.
      - name: German names from TCGdex
        continue-on-error: true
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/tcgdex/cards-database "$RUNNER_TEMP/tcgdex"
          git -C "$RUNNER_TEMP/tcgdex" sparse-checkout set "data/Pokémon TCG Pocket"
      # Card art for new cards: only the thumbnails folder of flibustier/pokemon-tcg-exchange
      - name: Card art
        continue-on-error: true
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/flibustier/pokemon-tcg-exchange "$RUNNER_TEMP/exchange"
          git -C "$RUNNER_TEMP/exchange" sparse-checkout set public/images/thumbnails
      - run: node pocket/tools/build-cards.mjs
        env:
          TCGDEX_DIR: ${{ runner.temp }}/tcgdex
          THUMBS_DIR: ${{ runner.temp }}/exchange/public/images/thumbnails
      - name: Save the card list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add pocket/cards.json pocket/cards
          git diff --cached --quiet && exit 0
          git commit -m "Daily Pocket card list"
          git pull --rebase --autostash origin main
          git push
