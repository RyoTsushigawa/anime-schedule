name: Deploy Season Preview voting Worker
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Google: the sheet owner's login (same OAuth client as the trailer playlists, own refresh token with the
      # Sheets permission) or, where the organisation allows key files, a service account
      GOOGLE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.SEASON_GOOGLE_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.SEASON_GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_PRIVATE_KEY: ${{ secrets.SEASON_GOOGLE_PRIVATE_KEY }}
      SHEET_ID: ${{ secrets.SEASON_SHEET_ID || '1cbkuLjyLfHpYDor5A1LvIskEOUB9Ij2Nm2TYch62-hQ' }}   # the Guckplan sheet (public in common.js)
      GROUP_ACCESS_CODE: ${{ secrets.SEASON_GROUP_ACCESS_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secrets
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SHEET_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done
          if [ -z "$GOOGLE_REFRESH_TOKEN" ] && { [ -z "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ] || [ -z "$GOOGLE_PRIVATE_KEY" ]; }; then
            echo "::error::Missing Google access: SEASON_GOOGLE_REFRESH_TOKEN (plus YOUTUBE_CLIENT_ID/SECRET), or a service account"
            exit 1
          fi
      - name: Awards storage (Cloudflare KV "anime-awards"), created on the first run
        run: |
          find_id() { npx --yes wrangler@4 kv namespace list | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const list=JSON.parse(s.slice(s.indexOf("[")));const n=list.find(x=>x.title==="anime-awards"||x.title.endsWith("-anime-awards"));process.stdout.write(n?n.id:"")})'; }
          id=$(find_id)
          if [ -z "$id" ]; then npx --yes wrangler@4 kv namespace create anime-awards; id=$(find_id); fi
          if [ -z "$id" ]; then echo "::error::KV namespace anime-awards not found or created"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "AWARDS"\nid = "%s"\n' "$id" >> workers/season-votes/wrangler.toml
          tail -4 workers/season-votes/wrangler.toml
      - name: Deploy voting Worker
        run: npx --yes wrangler@4 deploy --config workers/season-votes/wrangler.toml
      - name: Apply Worker secrets
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN GOOGLE_SERVICE_ACCOUNT_EMAIL GOOGLE_PRIVATE_KEY; do
            [ -n "${!name}" ] || continue
            printf '%s' "${!name}" | npx --yes wrangler@4 secret put "$name" --config workers/season-votes/wrangler.toml
          done
          printf '%s' "$SHEET_ID" | npx --yes wrangler@4 secret put SHEET_ID --config workers/season-votes/wrangler.toml
          # optional: without a group code voting is open
          if [ -n "$GROUP_ACCESS_CODE" ]; then printf '%s' "$GROUP_ACCESS_CODE" | npx --yes wrangler@4 secret put GROUP_ACCESS_CODE --config workers/season-votes/wrangler.toml; fi
      - name: Deployment instructions
        run: echo "After deployment, add the worker's URL to config.json as previewVotesUrl. Do not put secrets in config.json."
