name: Review Season Preview trailer
on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season ID, e.g. winter-2027"
        required: true
        default: winter-2027
        type: string
      anime_key:
        description: "Exact Anime Titel from the Sheet (case-insensitive)"
        required: true
        type: string
      action:
        description: "Review action"
        required: true
        default: approve-full
        type: choice
        options:
          - approve-full
          - approve-alternate
          - approve-teaser
          - mark-missing
          - mark-sequel
          - clear-status
      youtube_id:
        description: "11-character YouTube video ID (for approvals)"
        required: false
        type: string
      subtitles:
        description: "Confirmed subtitles (blank if unverified)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - de
          - en
      review_note:
        description: "Source/verification note (required for missing or sequel)"
        required: false
        type: string
      confirmed_official:
        description: "Official upload personally checked"
        required: true
        default: false
        type: boolean
      confirmed_footage:
        description: "Actual show footage personally checked"
        required: true
        default: false
        type: boolean
      confirmed_not_sequel:
        description: "Not a sequel personally checked"
        required: true
        default: false
        type: boolean
      confirmed_no_full:
        description: "Searched for a full trailer (required for missing/teaser)"
        required: true
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: season-preview-trailers
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate review and update catalog
        env:
          REVIEW_SEASON: ${{ inputs.season }}
          REVIEW_KEY: ${{ inputs.anime_key }}
          REVIEW_ACTION: ${{ inputs.action }}
          REVIEW_VIDEO: ${{ inputs.youtube_id }}
          REVIEW_SUBS: ${{ inputs.subtitles }}
          REVIEW_NOTE: ${{ inputs.review_note }}
          CONFIRMED_OFFICIAL: ${{ inputs.confirmed_official }}
          CONFIRMED_FOOTAGE: ${{ inputs.confirmed_footage }}
          CONFIRMED_NOT_SEQUEL: ${{ inputs.confirmed_not_sequel }}
          CONFIRMED_NO_FULL: ${{ inputs.confirmed_no_full }}
        run: |
          args=(--season "$REVIEW_SEASON" --key "$REVIEW_KEY" --action "$REVIEW_ACTION"
                --youtube "$REVIEW_VIDEO" --subs "$REVIEW_SUBS" --reason "$REVIEW_NOTE")
          if [ "$CONFIRMED_OFFICIAL" = "true" ]; then args+=(--confirmed-official); fi
          if [ "$CONFIRMED_FOOTAGE" = "true" ]; then args+=(--confirmed-footage); fi
          if [ "$CONFIRMED_NOT_SEQUEL" = "true" ]; then args+=(--confirmed-not-sequel); fi
          if [ "$CONFIRMED_NO_FULL" = "true" ]; then args+=(--confirmed-no-full); fi
          node scripts/season-preview-review.mjs "${args[@]}"
          node --test tests/season-preview.test.mjs tests/season-review.test.mjs tests/season-votes-worker.test.mjs
      - name: Commit reviewed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season-trailers.json
          if ! git diff --cached --quiet; then
            git commit -m "Review Season Preview trailer"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
