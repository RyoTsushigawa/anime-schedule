name: Season Preview trailers and playlist
on:
  workflow_dispatch:
  push:
    paths:
      - .github/season-discovery-request.txt
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: write
concurrency:
  group: season-preview-trailers
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Season Preview data rules
        run: node --test tests/season-preview.test.mjs
      - name: Discover candidate trailers from new season sheets
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/season-preview-discover.mjs
      - name: Sync real YouTube playlists (only with authorization)
        id: playlist_sync
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            node scripts/season-preview-playlist.mjs
          else
            echo "YouTube OAuth secrets not configured. Candidate discovery ran, playlist sync skipped."
          fi
      - name: Save reviewed candidate report and playlist mapping
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add season-trailer-candidates.json season-trailers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update upcoming season trailer candidates and playlists"
            git push
          fi
      - name: Signal incomplete playlist sync after preserving progress
        if: steps.playlist_sync.outcome == 'failure'
        run: exit 1
