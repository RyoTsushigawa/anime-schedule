name: Refresh LiveChart season metadata
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'
  push:
    paths:
      - .github/season-refresh-request.txt
permissions:
  contents: write
concurrency:
  group: season-livechart-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh current, previous, and upcoming season IDs
        run: node tools/build-streams.mjs --seasons-only
      - name: Validate refreshed season IDs
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('seasons.json','utf8'));
          const now=new Date();
          const quarters=['winter','spring','summer','fall'];
          const q=Math.floor(now.getUTCMonth()/3), year=now.getUTCFullYear();
          const targets=[
            quarters[q]+'-'+year,
            (q===0?'fall-'+(year-1):quarters[q-1]+'-'+year),
            (q===3?'winter-'+(year+1):quarters[q+1]+'-'+year)
          ];
          for(const key of targets){
            const list=data.seasons?.[key];
            if(!Array.isArray(list)||list.length<30)throw Error(key+' season list incomplete');
            const ids=list.filter(entry=>/^\d+$/.test(String(entry.livechartId||''))).length;
            if(ids<list.length*0.75)throw Error(key+' LiveChart IDs missing: '+ids+'/'+list.length);
            console.log(key+': '+ids+'/'+list.length+' LiveChart IDs');
          }
          NODE
      - name: Commit metadata refresh only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seasons.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh LiveChart season metadata and direct anime links"
            git push
          fi
