# Anime-Börse: one closing price per show and day (tools/boerse-prices.mjs → boerse-prices.json), from the
# Guckplan in the Sheet backup, AniList and the group's own ratings. The votes helper trades at the latest close.
name: Anime-Börse prices

on:
  schedule:
    - cron: '23 23 * * *'   # 00:23 CET / 01:23 CEST: after midnight; closes the previous Berlin day
  # The Cloudflare helper starts the daily Discord post with this event every morning: a second, reliable start.
  # An already published close is skipped, so the morning retry cannot change it.
  repository_dispatch:
    types: [discord-daily]
  workflow_dispatch:

permissions:
  contents: write   # boerse-prices.json

concurrency:
  group: boerse-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned
        with:
          node-version: 22
      - name: The Guckplan as of now (only read, not committed here)
        run: node tools/sheet-backup.mjs || echo "Sheet not reachable; using the last backup"
      - name: Today's closes
        env:
          GROUP_CODE: ${{ secrets.SEASON_GROUP_ACCESS_CODE }}   # reads the day's net trades from the votes helper
        run: node tools/boerse-prices.mjs
      - name: AniList IDs of the group's accounts (the votes helper reads them; AniList blocks Cloudflare)
        run: node tools/anilist-ids.mjs || echo "AniList IDs not updated"
      - name: Save the prices
        run: |
          git add boerse-prices.json anilist-ids.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Anime-Börse prices"
          git pull --rebase --autostash origin main
          git push

