# After a change to the page's files reaches main: raise the CACHE name in sw.js by itself, so visitors
# get the new version offered at once ("Neue Version ist da"). Nobody has to remember the number.
# Does nothing when the same push already changed the CACHE name.
name: Cache version

on:
  push:
    branches: [main]
    paths: ['*.html', '*.css', '*.js', 'manifest.webmanifest', '*.png', 'services/**', '!sw.js']

permissions:
  contents: write

concurrency:
  group: cache-version
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a moved tag can't change what runs
        with:
          fetch-depth: 0
      - name: Raise the CACHE name unless this push already did
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          name() { git show "$1:sw.js" 2>/dev/null | grep -m1 -oE "schedule-v[0-9]+" || true; }
          now=$(name HEAD); was=$(name "$BEFORE")
          echo "before: ${was:-unknown}, now: $now"
          if [ -z "$now" ]; then echo "No CACHE name found in sw.js; nothing changed."; exit 0; fi
          if [ -n "$was" ] && [ "$was" != "$now" ]; then echo "This push changed it already."; exit 0; fi
          # Other jobs also write to main. Retry on a non-fast-forward push
          # instead of failing just because another job landed first.
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            now=$(grep -m1 -oE "schedule-v[0-9]+" sw.js)
            next="schedule-v$(( ${now#schedule-v} + 1 ))"
            sed -i "s/$now/$next/" sw.js
            git add sw.js
            git commit -qm "Cache version ${next#schedule-}"
            if git push origin HEAD:main; then
              echo "Raised to $next."
              exit 0
            fi
            echo "::warning::Main changed during cache update (attempt $attempt/4); retrying."
            sleep $((attempt * 2))
          done
          echo "::error::Could not update cache version after four attempts."
          exit 1
