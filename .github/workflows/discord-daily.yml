# Every day at 09:00 German time: today's schedule goes to the Discord channel, the same text the
# Discord button on a day heading gives (tools/discord-daily.mjs). Needs the repository secret
# DISCORD_WEBHOOK_SCHEDULE (Discord: channel settings → Integrations → Webhooks → New Webhook → Copy Webhook URL).
name: Daily Discord schedule
# The run's name says what it was, for the delivery list on the site (N63 Discord-Zustellung)
run-name: ${{ github.event_name == 'push' && 'Aktualisierung' || (inputs.dry_run || inputs.test_edit || inputs.test_warning || github.event.client_payload.dry_run) && 'Probe' || github.event.client_payload.retry && 'Tagespost (erneut)' || 'Tagespost' }}

on:
  # GitHub's own timer starts runs hours late or not at all, so the Cloudflare helper starts this
  # every day at 08:50 German time (its cron trigger, see README "Daily Discord post"); the script waits for 09:00.
  # At any other time the helper's timer sends "dry_run": the message only goes to this run's log (a rehearsal).
  repository_dispatch:
    types: [discord-daily]
  # A change to the plan after the post is out (a delay, an absence, a move, a nickname): today's post is
  # edited so it stays right. No new message, no ping. Before the post it does nothing.
  push:
    branches: [main]
    paths: [moves.json, nicknames.json]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show the message in the log, post nothing'
        type: boolean
        default: true
      test_edit:
        description: 'Only test editing and pinning: a test line in the bot test channel, edited once, pinned and unpinned'
        type: boolean
        default: false
      test_warning:
        description: 'Only send the failure warning once, as a test (bot test channel, with ping)'
        type: boolean
        default: false

permissions:
  contents: write   # daily-post.json: remembers today's post so a later change can edit it

concurrency:
  group: discord-daily
  cancel-in-progress: false

jobs:
  post:
    # Fixed runner image avoids unexpected apt changes on ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned: a moved tag can't change what runs
        with:
          ref: main   # the newest plan, also when this run waited behind another one
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0, pinned
        with:
          node-version: 22
      - name: Install the headless browser
        if: ${{ !inputs.test_warning }}
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          # GitHub's Ubuntu image already ships the common Chromium libraries.
          # Avoid apt mirror/DNS failures from --with-deps during each daily post.
          for i in 1 2 3; do npx playwright install chromium && exit 0; echo "Browser download failed ($i/3), retrying"; sleep 30; done
          exit 1
      - name: Post today's schedule
        if: ${{ !inputs.test_warning }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_SCHEDULE }}
          WAIT_FOR_NINE: ${{ github.event_name == 'repository_dispatch' }}
          DISCORD_WEBHOOK_LOGS: ${{ secrets.DISCORD_WEBHOOK_LOGS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}   # optional: pins the post (see tools/discord-daily.mjs)
        run: node tools/discord-daily.mjs ${{ (inputs.dry_run || github.event.client_payload.dry_run) && !inputs.test_edit && '--dry-run' || '' }} ${{ github.event_name == 'push' && '--update' || '' }} ${{ inputs.test_edit && '--test-edit' || '' }}
      - name: Remember today's post
        if: ${{ !inputs.test_warning && !inputs.test_edit }}
        run: |
          git add daily-post.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Today's Discord post"
          git pull --rebase origin main
          git push
      # A run that broke (site not reachable, Discord refused) says so in the logs channel and pings the owner.
      # Needs the repository secret DISCORD_WEBHOOK_LOGS (the logs channel's webhook); without it nothing is sent.
      - name: Say that the post failed
        if: ${{ failure() && !(inputs.dry_run || github.event.client_payload.dry_run) }}
        env:
          DISCORD_WEBHOOK_LOGS: ${{ secrets.DISCORD_WEBHOOK_LOGS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_LOGS" ] || { echo "No DISCORD_WEBHOOK_LOGS secret; no warning sent."; exit 0; }
          curl -sS -o /dev/null -H 'Content-Type: application/json' \
            -d "{\"content\":\"<@255387990136848385> ⚠️ Der Tagespost konnte heute nicht ${{ github.event_name == 'push' && 'aktualisiert' || 'erstellt' }} werden. (<$RUN_URL>)\",\"allowed_mentions\":{\"users\":[\"255387990136848385\"]}}" \
            "$DISCORD_WEBHOOK_LOGS"
      # "Run workflow" with test_warning ticked: shows that the warning reaches the logs channel. Posts no schedule.
      - name: Send the warning as a test
        if: ${{ inputs.test_warning }}
        env:
          DISCORD_WEBHOOK_LOGS: ${{ secrets.DISCORD_WEBHOOK_LOGS }}
        run: |
          [ -n "$DISCORD_WEBHOOK_LOGS" ] || { echo "The secret DISCORD_WEBHOOK_LOGS is missing or empty."; exit 1; }
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"content":"<@255387990136848385> 🧪 Test: so sieht die Warnung aus, wenn der Tagespost fehlschlägt. Es ist nichts passiert.","allowed_mentions":{"users":["255387990136848385"]}}' \
            "$DISCORD_WEBHOOK_LOGS")
          echo "Discord answered $status"
          [ "$status" = "204" ] || [ "$status" = "200" ]
